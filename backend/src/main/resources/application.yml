spring:
  application:
    name: backend
  profiles:
    default: local

  # READ_COMMITTED: tras esperar el lock de capacidad técnica (5.2), cada consulta ve lo último
  # confirmado. Con el REPEATABLE_READ por defecto de InnoDB se seguiría leyendo una foto vieja.
  datasource:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED

  jpa:
    hibernate:
      ddl-auto: validate # Flyway controla el esquema
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  jackson:
    time-zone: America/Argentina/Buenos_Aires

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  mail:
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}

server:
  port: 9090

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  # Sin valor por defecto: JwtTokenProvider no arranca sin una clave propia (REV-11).
  secret: ${JWT_SECRET:}
  access-token:
    expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000} # 15 minutes by default
  refresh-token:
    expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000} # 7 days by default

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
    tags-sorter: alpha

app:
  # URL pública del frontend (links de seguimiento en correos)
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:noreply@gestion-eventos.local}
    mock-mode: ${MAIL_MOCK_MODE:true}
    fail-on-error: ${MAIL_FAIL_ON_ERROR:true}
